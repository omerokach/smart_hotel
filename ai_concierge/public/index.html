<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guest Authentication | Miley Hotel</title>

  <link rel="stylesheet" href="css/index.css" />
</head>

<body class="auth-body">

  <div class="auth-shell">
    
    <div id="success-bubble" class="success-bubble">
      <span class="bubble-icon">✔</span>
      <span class="bubble-text">Authentication successful</span>
    </div>
    
    <div id="error-bubble" class="error-bubble">
      <span class="bubble-icon">✖</span>
      <span class="bubble-text">Error</span>
    </div>

    <div class="auth-card">

      <!-- TOP HERO (logo + background color + wave) -->
      <div class="auth-hero">
        <div class="auth-hero-pattern"></div>

        <div class="auth-hero-content">
          <!-- Centered logo -->
          <img src="assets/logo/miley-logo.png" alt="Miley Hotel Logo" class="hero-logo" />
        </div>
      </div>

      <!-- white content area -->
      <div class="auth-content">

        <div class="auth-header">
          <h2 class="auth-title">Sign in</h2>
          <div class="auth-underline"></div>
          <p class="auth-subtitle">Please enter your room number and mobile phone.</p>
        </div>

        <!-- Form submission is handled via JavaScript (fetch API) -->
        <form class="auth-form" id="guest-auth-form">
          <div class="field">
            <label for="room_number" class="field-label">Room number</label>
            <input
              id="room_number"
              name="room_number"
              type="text"
              class="field-input"
              inputmode="numeric"
              placeholder="e.g. 504"
              required
            />
          </div>

          <div class="field">
            <label for="phone_number" class="field-label">Mobile phone number</label>
            <input
              id="phone_number"
              name="phone_number"
              type="tel"
              class="field-input"
              inputmode="tel"
              placeholder="As provided at check-in"
              required
            />
          </div>

          <button type="submit" class="auth-button">Continue</button>
        </form>

        <!--  Fail/Success Message -->
        <div id="auth-message" class="auth-message"></div>

        <div class="auth-footer">
          If the details do not match, please contact the front desk.
        </div>

      </div>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
