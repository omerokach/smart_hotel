<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MILEY · Tasks Dashboard</title>

  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/tasks.css">
</head>

<body>
  <div id="global-loader" class="loader hidden">
  <div class="spinner"></div>
</div>

  <section id="tasks" class="screen">

    <div class="dashboard-layout">
      
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <img src="assets/logo/miley-logo.png" alt="Miley logo" class="logo">
        </div>

        <nav class="menu">
          <a href="home.html" class="menu-item">
            <img src="assets/icons/home.png" alt="Home icon">
            <span>Home</span>
          </a>
          <a href="guests.html" class="menu-item">
            <img src="assets/icons/guests.png" alt="Guests icon">
            <span>Guests</span>
          </a>
          <a href="rooms.html" class="menu-item">
            <img src="assets/icons/rooms.png" alt="Rooms icon">
            <span>Rooms</span>
          </a>
          <a href="tasks.html" class="menu-item active">
            <img src="assets/icons/tasks.png" alt="Tasks icon">
            <span>Tasks</span>
          </a>
          <a href="reports.html" class="menu-item">
            <img src="assets/icons/reports.png" alt="Reports icon">
            <span>Reports</span>
          </a>
          <a href="messages.html" class="menu-item">
            <img src="assets/icons/messages.png" alt="Messages icon">
            <span>Messages</span>
          </a>
          <a href="settings.html" class="menu-item">
            <img src="assets/icons/settings.png" alt="Settings icon">
            <span>Settings</span>
          </a>
        </nav>
      </aside>

      <!-- Main Dashboard -->
      <main class="content">
        <div class="dashboard-wrapper">

          <!-- Header -->
          <header class="header">
            <div>
              <h2>Tasks</h2>
              <p class="sub">Your Weekly Tasks</p>
            </div>
          </header>

          <!-- Filters -->
          <div class="filters-container">

            <select id="filter-status" class="filter-select">
                <option value="all">All statuses</option>
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
            </select>

            <select id="filter-urgency" class="filter-select">
                <option value="all">All urgency levels</option>
                <option value="Normal">Normal</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
                <option value="Low">Low</option>
            </select>

            <select id="filter-department" class="filter-select">
                <option value="all">All departments</option>
                <option value="Housekeeping">Housekeeping</option>
                <option value="Maintenance">Maintenance</option>
                <option value="FrontDesk">Front Desk</option>
            </select>

          </div>

          <!-- Task Table -->
          <section class="task-table">
            <table>
              <thead>
                <tr>
                  <th></th>
                  <th>Department</th>
                  <th>Request Type</th>
                  <th>Room number</th>
                  <th id="sort-time" class="sortable">Time submitted ▲▼</th>
                  <th>Status</th>
                  <th>Urgency</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </section>

        </div>
      </main>

    </div>
  </section>

  <script src="js/global.js"></script>
  <script src="js/tasks.js"></script>

</body>
</html>
