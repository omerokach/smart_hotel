<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MILEY · Task Details</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/task-details.css">
</head>

<!-- Success Modal -->
<div id="success-modal" class="modal hidden">
  <div class="modal-content">
    <p id="modal-message">Task updated successfully!</p>
    <button id="modal-close">OK</button>
  </div>
</div>

<body>
  <div id="global-loader" class="loader hidden">
  <div class="spinner"></div>
</div>

<section class="screen">

  <div class="dashboard-layout">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo/miley-logo.png" class="logo" alt="Miley logo">
      </div>

      <nav class="menu">
        <a href="home.html" class="menu-item">
          <img src="assets/icons/home.png"><span>Home</span>
        </a>
        <a href="guests.html" class="menu-item">
          <img src="assets/icons/guests.png"><span>Guests</span>
        </a>
        <a href="rooms.html" class="menu-item">
          <img src="assets/icons/rooms.png"><span>Rooms</span>
        </a>
        <a href="tasks.html" class="menu-item active">
          <img src="assets/icons/tasks.png"><span>Tasks</span>
        </a>
        <a href="reports.html" class="menu-item">
          <img src="assets/icons/reports.png"><span>Reports</span>
        </a>
        <a href="messages.html" class="menu-item">
          <img src="assets/icons/messages.png"><span>Messages</span>
        </a>
        <a href="settings.html" class="menu-item">
          <img src="assets/icons/settings.png"><span>Settings</span>
        </a>
      </nav>
    </aside>

    <!-- ===== Content ===== -->
    <main class="content">
      <div class="dashboard-wrapper">

        <!-- Header -->
        <header class="header">
          <div>
            <h2>Task Details</h2>
            <p class="sub">Manage and update this task</p>
          </div>
        </header>

        <!-- Task View -->
        <section id="task-details" class="task-details-card">

          <!-- Title + Status bubble -->
          <div class="task-header">
            <h3 id="task-title">Loading...</h3>
            <span id="task-status-pill" class="status-pill">Loading</span>
          </div>

          <!-- Grid -->
          <div class="task-grid">

            <!-- Left column -->
            <div class="left-col">
              <label>Department</label>
              <select id="department">
                <option value="Housekeeping">Housekeeping</option>
                <option value="Maintenance">Maintenance</option>
                <option value="FrontDesk">Front Desk</option>
              </select>

              <label>Urgency level</label>
              <select id="urgency">
                <option value="Low">Low</option>
                <option value="Normal">Normal</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
              </select>
            </div>

            <!-- Right column -->
            <div class="right-col">
              <label>Status</label>
              <select id="status">
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="manager_approval">Manager Approval</option>
                <option value="done">Done</option>
              </select>

              <label>Guest request description</label>
              <p id="request-description" class="request-text"></p>
            </div>

            <!-- Internal notes -->
            <div class="full-col">
              <label>Internal notes</label>
              <textarea id="notes" placeholder="Write any clarifications if needed"></textarea>
            </div>

          </div>

          <!-- Actions -->
          <div class="task-actions">
            <button class="secondary-btn" id="btn-return">Return</button>
            <button class="primary-btn" id="btn-update">Update Task</button>
          </div>

        </section>

      </div>
    </main>

  </div>
</section>

<script src="global.js"></script>
<script src="task-details.js"></script>


</body>
</html>
