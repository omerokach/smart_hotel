<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MILEY · messages</title>

  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/messages.css">
</head>

<body>
  <div id="global-loader" class="loader hidden">
  <div class="spinner"></div>
</div>
<section class="screen">

  <div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="assets/logo/miley-logo.png" class="logo">
      </div>

      <nav class="menu">
        <a href="home.html" class="menu-item">
          <img src="assets/icons/home.png"><span>Home</span>
        </a>
        <a href="guests.html" class="menu-item">
          <img src="assets/icons/guests.png"><span>Guests</span>
        </a>
        <a href="rooms.html" class="menu-item">
          <img src="assets/icons/rooms.png"><span>Rooms</span>
        </a>
        <a href="tasks.html" class="menu-item">
          <img src="assets/icons/tasks.png"><span>Tasks</span>
        </a>
        <a href="reports.html" class="menu-item">
          <img src="assets/icons/reports.png"><span>Reports</span>
        </a>
        <a href="messages.html" class="menu-item active">
          <img src="assets/icons/messages.png"><span>Messages</span>
        </a>
        <a href="settings.html" class="menu-item">
          <img src="assets/icons/settings.png"><span>Settings</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
      <div class="dashboard-wrapper">

        <!-- LEFT PANEL: Conversations -->
        <div class="conversations-panel" id="conversations-panel">
          <h3 class="panel-title">Open conversations</h3>
          <div id="conversations-list" class="conversations-list"></div>
        </div>

        <!-- RIGHT PANEL: Chat -->
        <div class="chat-panel">

          <header class="messages-header">
            <div>
              <h2 id="messages-client-name">Select a conversation</h2>
              <p class="sub" id="messages-status"> </p>
            </div>
            <button id="create-task-btn" class="create-task-btn">+ Create Task</button>
          </header>

          <div class="messages-box" id="messages-box"></div>

          <div class="messages-input">
            <input type="text" id="messages-input" placeholder="Write a message..." disabled />
            <button id="send-btn" disabled>Send</button>
          </div>

        </div>

      </div>
    </main>

  </div>

  <!-- Success Modal -->
  <div id="success-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-icon">✓</div>
      <p id="modal-message">Task created successfully!</p>
      <button id="modal-ok-btn" class="modal-ok-btn">OK</button>
    </div>
  </div>

  <!-- Create Task Popup -->
  <div id="create-task-popup" class="popup-overlay">
    <div class="popup-content">
      <button class="popup-close" id="popup-close">&times;</button>
      <h3>Create Task</h3>
      <form id="create-task-form">
        <label>Room</label>
        <input type="text" id="task-room" readonly />
        
        <label>Request Type</label>
        <select id="task-title" required>
          <option value="">Select...</option>
          <option value="Room Service">Room Service</option>
          <option value="Housekeeping">Housekeeping</option>
          <option value="Spa Service">Spa Service</option>
          <option value="Transportation">Transportation</option>
          <option value="Equipment Request">Equipment Request</option>
          <option value="General Request">General Request</option>
        </select>
        
        <label>Department</label>
        <select id="task-department" required>
          <option value="">Select...</option>
          <option value="Front Desk">Front Desk</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Housekeeping">Housekeeping</option>
        </select>
        
        <label>Internal Notes</label>
        <textarea id="task-notes" rows="3" placeholder="Add any internal notes..."></textarea>
        
        <button type="submit" class="popup-create-btn">Create</button>
      </form>
    </div>
  </div>

</section>
  
<script src="js/global.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
